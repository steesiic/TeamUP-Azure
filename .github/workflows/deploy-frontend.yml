name: Deploy TeamUP Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'Client/teamup/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Client/teamup/package-lock.json

      - name: Install dependencies
        working-directory: Client/teamup
        run: npm ci

      - name: Build frontend
        working-directory: Client/teamup
        run: npm run build

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Storage
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az storage blob upload-batch \
              --account-name teamupfrontend1708 \
              --destination '$web' \
              --source Client/teamup/dist \
              --auth-mode login \
              --overwrite